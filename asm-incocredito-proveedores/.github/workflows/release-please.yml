name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Repo sin empaquetado (sin setup.py/pyproject): estrategia
          # generica con version.txt + CHANGELOG.md.
          release-type: simple
